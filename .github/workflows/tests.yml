name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libperl-critic-perl \
            libio-socket-ssl-perl \
            libdbi-perl \
            libdbd-sqlite3-perl
      - name: prove -lr
        run: prove -lr
